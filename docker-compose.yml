services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: sitepulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitepulse_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sitepulse}
    volumes:
      # Persistent named volume - Data survives restarts, reboots, and updates!
      - sitepulse_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. SitePulse Unified Application Service
  #    (Dashboard + Widget CDN + Socket.IO + REST API)
  # ==========================================
  sitepulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitepulse_app
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sitepulse_secure_pass}@postgres:5432/${POSTGRES_DB:-sitepulse}?schema=public
      JWT_SECRET: ${JWT_SECRET:-sitepulse_production_jwt_secret_key_2026}
      DAILY_SALT: ${DAILY_SALT:-sitepulse_daily_salt_privacy_salt}
    ports:
      # Unified single port for Dashboard, Embed Script, and API
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

# Persistent Named Volumes
volumes:
  sitepulse_pgdata:
    driver: local
